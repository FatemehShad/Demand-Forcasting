[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "retail-demand-forecasting"
version = "0.1.0"
description = "Leakage-safe multiweek retail demand forecasting"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "pandas>=2.0,<3", "scikit-learn>=1.4,<2", "joblib>=1.3,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "jupyterlab>=4,<5", "nbclient>=0.10,<1", "nbformat>=5,<6", "matplotlib>=3.8,<4"]

[project.scripts]
demand-forecast = "demand_forecasting.cli:main"

[tool.setuptools.packages.find]
include = ["demand_forecasting*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
